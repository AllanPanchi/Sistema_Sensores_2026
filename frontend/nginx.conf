server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Acorde al máximo de subida del backend (CSV hasta 10 MB).
    client_max_body_size 15m;

    # Proxy de la API al backend: mismo origen para el navegador → sin CORS.
    # Sin barra final en proxy_pass: se conserva el prefijo /api al reenviar.
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: toda ruta no encontrada cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
